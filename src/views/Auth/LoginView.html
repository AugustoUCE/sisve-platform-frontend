<div class="login-shell">
  <div class="login-glow login-glow-a"></div>
  <div class="login-glow login-glow-b"></div>
  <div class="login-grid"></div>

  <section class="hero-panel">
    <div class="brand-mark">
      <span class="brand-chip">SVE</span>
      <strong>{{ loginTitle }}</strong>
      <p>{{ loginSubtitle }}</p>
    </div>
    <div class="logo-container">
      <img src="@/assets/Logo.png" alt="Sisve logo" width="400" height="400" />
    </div>
  </section>

  <section class="login-card">
    <header class="card-header">
      <div>
        <span class="eyebrow">Ingreso al sistema</span>
        <h2>Iniciar sesión</h2>
      </div>
    </header>

    <form class="login-form" @submit.prevent="submitLogin">
      <label class="field">
        <span>Documento de identidad</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="10" r="1.5"/><circle cx="12" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/><path d="M7 15h10"/></svg>
          <input v-model="form.cedula" type="text" placeholder="Escribe tu documento" autocomplete="username" />
        </div>
      </label>

      <label class="field">
        <span>Correo electrónico</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input v-model="form.correoInstitucional" type="email" placeholder="tu-correo@dominio.com" autocomplete="email" />
        </div>
      </label>

      

      <p v-if="errorMessage" class="error-message">{{ errorMessage }}</p>

      <button class="submit-button" type="submit" :disabled="isSubmitting">
        {{ isSubmitting ? 'Validando…' : 'Entrar al sistema' }}
      </button>
    </form>

    <footer class="card-footer">
      <span>Soporte técnico disponible durante el proceso electoral.</span>
      <a href="#">Recuperar acceso</a>
    </footer>
  </section>
</div>
